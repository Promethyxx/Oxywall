name: Oxywall CI/CD
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Win_x64
            artifact_name: Oxywall_Win_x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Lin_x64
            artifact_name: Oxywall_Lin_x64
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ matrix.label }}-cargo-
    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ cmake pkg-config libssl-dev
    - name: Build
      run: cargo build --release --target ${{ matrix.target }}
    - name: Prepare binary (Windows)
      if: runner.os == 'Windows'
      run: Copy-Item target/${{ matrix.target }}/release/Oxywall.exe ${{ matrix.artifact_name }}
      shell: pwsh
    - name: Prepare binary (Linux)
      if: runner.os == 'Linux'
      run: |
        cp target/${{ matrix.target }}/release/Oxywall ${{ matrix.artifact_name }}
        chmod +x ${{ matrix.artifact_name }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.label }}
        path: ${{ matrix.artifact_name }}
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    name: Package Flatpak
    steps:
    - name: Download Linux binary
      uses: actions/download-artifact@v4
      with:
        name: binary-Lin_x64
    - name: Install Flatpak tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - name: Write manifest
      run: |
        cat > io.github.Promethyxx.Oxywall.json <<'EOF'
        {
          "app-id": "io.github.Promethyxx.Oxywall",
          "runtime": "org.freedesktop.Platform",
          "runtime-version": "24.08",
          "sdk": "org.freedesktop.Sdk",
          "command": "Oxywall",
          "finish-args": [
            "--share=network",
            "--share=ipc",
            "--socket=wayland",
            "--socket=fallback-x11",
            "--device=dri",
            "--filesystem=home"
          ],
          "modules": [
            {
              "name": "oxywall",
              "buildsystem": "simple",
              "build-commands": [
                "install -Dm755 Oxywall_Lin_x64 /app/bin/Oxywall"
              ],
              "sources": [
                {
                  "type": "file",
                  "path": "Oxywall_Lin_x64"
                }
              ]
            }
          ]
        }
        EOF
    - name: Build Flatpak
      run: |
        flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo build-dir io.github.Promethyxx.Oxywall.json
        flatpak build-bundle repo Oxywall_Lin_x64.flatpak io.github.Promethyxx.Oxywall
    - name: Upload Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: flatpak-Lin_x64
        path: Oxywall_Lin_x64.flatpak
  release:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    name: Release
    steps:
    - uses: actions/checkout@v4
    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Oxywall ${{ steps.version.outputs.version }}
        body: |
          ## Platforms
          | Platform | Oxywall | Name |
          |---|:---:|---|
          | Linux x64 (Flatpak) | ✅ | Oxywall_Lin_x64.flatpak |
          | Windows x64 | ✅ | Oxywall_Win_x64.exe |
        files: |
          Oxywall_Win_x64.exe
          Oxywall_Lin_x64.flatpak
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
