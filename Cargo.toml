[package]
name = "Oxywall"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
# vos dépendances habituelles...
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
rand = "0.10"
anyhow = "1"
lazy_static = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
